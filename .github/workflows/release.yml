name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z), tagged on the selected commit"
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    # The `release` environment requires the owner's manual approval.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be x.y.z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and build registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_agents.py
          python3 scripts/build_registry.py "$VERSION" "$GITHUB_SHA"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" registry.json --target "$GITHUB_SHA" \
            --title "$VERSION" --notes "Agents release $VERSION. registry.json lists the SHA-256 of every file."
